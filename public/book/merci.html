<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — réservation en cours de confirmation</title>
<link rel="stylesheet" href="book.css">
</head>
<body>
<div class="pub" style="max-width:560px">
  <!-- Page de fin de parcours : sans ce lien, la seule sortie est le bouton
       « précédent » du navigateur (issue #47-5). -->
  <a class="back-top" href="/" data-i18n>← Retour au site</a>
  <div class="card center" id="box">
    <div class="big-check">⏳</div>
    <h3 data-i18n>Confirmation en cours…</h3>
    <p class="muted small" data-i18n>Nous vérifions votre paiement, cela prend quelques secondes. Vous pouvez garder cette page ouverte : la confirmation vous parvient aussi par e-mail.</p>
  </div>
  <p class="footer-note legal-links" data-i18n><a href="/mentions-legales/">Mentions légales</a> · <a href="/confidentialite/">Confidentialité</a> · <a href="/conditions-generales/">Conditions générales</a></p>
</div>
<script type="module">
import { apiHeaders, eur, hour, LANG, t, translateStatic } from "./i18n.js";
translateStatic();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const q = new URLSearchParams(location.search);
const ref = q.get("ref"), email = q.get("email");
// Retour d'un moyen de paiement à redirection (Bancontact, issue #26). Cet
// indice ne prouve rien : c'est le webhook qui confirme. Il sert seulement à
// dire la vérité pendant l'attente, au lieu d'un « Confirmation en cours… »
// qui laisserait croire à un simple délai d'affichage.
const redirectStatus = q.get("redirect_status");
const voucherUrl = `/book/voucher.html?ref=${encodeURIComponent(ref || "")}&email=${encodeURIComponent(email || "")}${LANG === "nl" ? "&lang=nl" : ""}`;

async function poll(attempt = 0) {
  const box = document.getElementById("box");
  if (!ref || !email) {
    box.innerHTML = `<div class="big-check">✅</div><h3>${t("Paiement reçu")}</h3>
      <p class="muted small">${t("Votre confirmation arrive par email.")}</p>
      <p class="small muted">${t("Son objet commence par la référence de votre réservation. Une question ? Répondez simplement à cet e-mail.")}</p>`;
    return;
  }
  if (attempt === 0 && redirectStatus === "failed") {
    box.innerHTML = `<div class="big-check">⚠️</div><h3>${t("Paiement non abouti")}</h3>
      <p class="muted small">${t("Aucun montant n'a été débité. Votre créneau reste bloqué quelques minutes : vous pouvez réessayer depuis votre réservation.")}</p>
      <p style="margin-top:10px"><a class="btn" href="${voucherUrl}">${t("Reprendre le paiement")}</a></p>`;
    return;
  }
  if (attempt === 0 && redirectStatus === "processing") {
    box.innerHTML = `<div class="big-check">🕐</div><h3>${t("Paiement en cours de traitement")}</h3>
      <p class="muted small">${t("Votre banque traite le paiement (Bancontact met parfois quelques minutes). Cette page se met à jour toute seule dès que la confirmation nous parvient.")}</p>`;
  }
  try {
    const res = await fetch(`/api/public/bookings/${encodeURIComponent(ref)}?email=${encodeURIComponent(email)}`, { headers: apiHeaders() });
    const data = await res.json();
    if (res.ok && data.booking.status === "confirmed") {
      const bk = data.booking;
      // Payé : le décompte « créneau bloqué » du tunnel n'a plus lieu d'être.
      // Sans ce nettoyage, le visiteur qui retourne sur la page de réservation
      // y lit « reprendre le paiement » alors qu'il a déjà payé.
      try { for (const k of Object.keys(sessionStorage)) if (k.startsWith("gites-hold:")) sessionStorage.removeItem(k); } catch { /* navigation privée */ }
      const dfr = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
      const balance = bk.balanceCents > 0
        ? (bk.balanceDueDate
          ? t("Le solde de {montant} est à payer avant le {date} : vous recevrez un lien de paiement par e-mail, et vous pouvez aussi payer dès maintenant depuis votre voucher.", { montant: eur(bk.balanceCents), date: dfr(bk.balanceDueDate) })
          : t("Le solde de {montant} reste à payer : vous le réglez en ligne depuis votre voucher.", { montant: eur(bk.balanceCents) }))
        : t("Votre séjour est intégralement réglé : il n'y a plus rien à payer.");
      box.innerHTML = `<div class="big-check">✅</div>
        <h3>${t("Réservation confirmée !")}</h3>
        <p>${t("Référence <b class=\"mono\">{ref}</b>", { ref: esc(ref) })}<br>
        <span class="small muted">${esc(bk.unitName)} · ${t("du {du} au {au}", { du: dfr(bk.checkin), au: dfr(bk.checkout) })}</span></p>
        <div class="next" style="text-align:left"><h4>${t("Ce qui se passe maintenant")}</h4><ol>
          <li>${t("Vous recevez dans quelques minutes un e-mail de confirmation, avec votre récapitulatif et les conditions générales. Son objet commence par [{ref}].", { ref: esc(ref) })}</li>
          <li>${balance}</li>
          <li>${t("Arrivée dès {arr}, départ avant {dep}.", { arr: esc(hour(data.stay?.checkinTime)), dep: esc(hour(data.stay?.checkoutTime)) })}</li>
          <li>${t("Une question ? Répondez simplement à l'e-mail de confirmation : pas de chat, nous répondons par e-mail.")}</li></ol></div>
        <p style="margin-top:14px"><a class="btn" href="${voucherUrl}">${t("Voir mon voucher")}</a></p>
        <p class="small muted" style="margin-top:8px">${t("Pas reçu l'e-mail ? Regardez dans vos courriers indésirables, ou retrouvez tout sur votre voucher.")}</p>`;
      return;
    }
  } catch { /* on repollera */ }
  if (attempt < 20) {
    setTimeout(() => poll(attempt + 1), 1500);
  } else {
    box.innerHTML = `<div class="big-check">🕐</div><h3>${t("Paiement en cours de traitement")}</h3>
      <p class="muted small">${t("La confirmation peut prendre quelques minutes. Retrouvez votre réservation ici :")}</p>
      <p style="margin-top:10px"><a class="btn o" href="${voucherUrl}">${t("Voir ma réservation")}</a></p>`;
  }
}
poll();
</script>
</body>
</html>
